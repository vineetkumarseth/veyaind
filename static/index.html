<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veya</title>
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('veya_theme')||'dark')</script>
<style>
:root{color-scheme:dark;--bg:#0a0c0f;--side:#0e1114;--panel:#12161a;--panel2:#181d22;--ink:#e9edf1;--mute:#8a94a0;--faint:#5d6772;--line:#1d2328;--line2:#2a323a;--accent:#a8c4ec;--on:#0a0c0f;--user:#0a7cff;--danger:#ff8f7c;--ok:#5fd3a0;--code:#0b0e11;--codeink:#d6e2ea;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);--sans:"Inter","SF Pro Text","Segoe UI",system-ui,-apple-system,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Charter,Georgia,serif}
[data-theme=light]{color-scheme:light;--bg:#f6f7f9;--side:#eef0f3;--panel:#fff;--panel2:#f1f3f6;--ink:#10151a;--mute:#5c6772;--faint:#8c96a1;--line:#e2e6ea;--line2:#d3d9df;--accent:#1d4e9b;--on:#fff;--user:#0a6cf0;--danger:#c0392b;--ok:#17855a;--sh:0 1px 2px rgba(16,21,26,.06),0 12px 30px rgba(16,21,26,.08)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%}
.ic{display:inline-grid;place-items:center;flex:none}
/* ---- shell ---- */
.app{display:flex;height:100%;position:relative;overflow:hidden}
.side{width:264px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px;transition:margin-left .2s ease;z-index:30}
.app[data-side=closed] .side{margin-left:-264px}
.brand-row{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.wm{font:600 18px var(--sans);letter-spacing:.2px;flex:1}
.mk{width:28px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--accent);flex:none}
.mk svg{width:18px;height:18px}
.ibtn{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--mute);display:grid;place-items:center;padding:0}
.ibtn:hover{background:var(--panel2);color:var(--ink)}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;background:none;color:var(--ink);border-radius:9px;text-align:left}
.nv .ic{color:var(--mute)}
.nv:hover,.nv[aria-current=true]{background:var(--panel2)}
.nv .k{margin-left:auto;font:11px ui-monospace,Menlo,monospace;color:var(--mute);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.grp{font-size:12px;color:var(--faint);padding:14px 10px 4px}
.clist{flex:1;overflow:auto;min-height:0}
.ci{display:flex;align-items:center;border-radius:9px}
.ci.on,.ci:hover{background:var(--panel2)}
.ct{flex:1;min-width:0;text-align:left;background:none;border:0;padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx{background:none;border:0;color:var(--mute);padding:6px 9px;visibility:hidden;border-radius:6px}
.ci:hover .cx{visibility:visible}.cx:hover{color:var(--danger)}
.empt{color:var(--mute);padding:6px 10px;font-size:13px}
.sfoot{position:relative;border-top:1px solid var(--line);padding-top:10px;margin-top:6px;display:grid;gap:8px}
.cred{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:none;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink);justify-self:start}
.cred b{font-weight:600}.cred span{color:var(--mute);letter-spacing:.06em}
.acb{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:6px;border-radius:10px;text-align:left}
.acb:hover{background:var(--panel2)}
.avt{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7aa2e8,#b58cf0);display:grid;place-items:center;font:600 12px var(--sans);color:#0a0c0f;flex:none}
.an{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font:600 10px var(--sans);letter-spacing:.08em;border-radius:999px;padding:2px 8px;background:var(--panel2);border:1px solid var(--line2);color:var(--mute)}
.pop{display:none;position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh);padding:6px;min-width:220px}
.pop.open{display:block;max-height:min(50vh,400px);overflow-y:auto}
.pop.up{bottom:calc(100% + 8px)}
.pop.l{left:0}.pop.r{right:0}
.pop .em{font-size:12.5px;color:var(--mute);padding:6px 10px;overflow-wrap:anywhere}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px}
.mi:hover{background:var(--panel2)}
.mi small{display:block;color:var(--mute);font-size:12px}
.mi .ic{color:var(--mute)}
.mi[aria-checked=true]::after{content:"\2713";margin-left:auto;color:var(--accent)}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 10px 2px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.hd{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:52px;flex:none}
.hd h2{font-size:14.5px;font-weight:600;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{flex:1;overflow:auto}
.page{max-width:1040px;margin:0 auto;padding:6px 28px 56px}
.page h1{font-size:26px;margin:6px 0 4px;font-weight:600}
.page .sub{color:var(--mute);margin:0 0 26px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.scrim{display:none}
/* ---- buttons / inputs ---- */
.btn{background:var(--accent);color:var(--on);border:0;border-radius:10px;padding:9px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line2);font-weight:500}
.btn.warn{background:none;color:var(--danger);border:1px solid var(--line2);font-weight:500}
.btn.sm{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:9px;font-size:13px}
.pill:hover{border-color:var(--faint)}
.pill[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:transparent}
.pill svg{width:15px;height:15px}
.inp{width:100%;padding:13px 15px;border-radius:10px;border:1px solid transparent;background:var(--panel2);color:var(--ink);margin:0 0 12px}
.inp:focus{outline:0;border-color:var(--line2)}
textarea.inp{min-height:150px;resize:vertical;line-height:1.5}
.sel{padding:8px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);max-width:100%}
.err{color:var(--danger);min-height:20px;font-size:13.5px}
.note{font-size:12.5px;color:var(--mute)}.note.warn{color:var(--danger)}
.lnk{background:none;border:0;color:var(--ink);padding:0;text-decoration:underline;text-underline-offset:3px}
.card2{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:18px}
/* ---- auth ---- */
.auth{display:grid;grid-template-columns:1fr 1fr;height:100%;background:#0a0c0f;color:#e9edf1}
.art{position:relative;overflow:hidden;background:#0d1117;display:flex;flex-direction:column;justify-content:flex-end;padding:44px}
.art::before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 35% at 30% 25%,#7f9fd1 0,transparent 70%),radial-gradient(45% 40% at 80% 20%,#a9c3ea 0,transparent 70%),radial-gradient(50% 45% at 20% 80%,#41587d 0,transparent 70%),radial-gradient(40% 40% at 85% 85%,#2c3d58 0,transparent 70%);filter:blur(30px);opacity:.85}
.art .glyph{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(46%,260px);filter:drop-shadow(0 0 26px rgba(190,215,255,.55))}
.art h3{position:relative;font:600 32px/1.15 var(--sans);margin:0 0 22px;letter-spacing:-.4px;min-height:74px;color:#fff}
.art h3 em{font-style:normal;color:#a9c3ea;display:block}
.pager{position:relative;display:flex;align-items:center;gap:8px}
.pager i{display:block;height:3px;width:28px;border-radius:2px;background:rgba(255,255,255,.35);cursor:pointer}
.pager i.on{width:48px;background:#fff}
.pager span{margin-left:auto;font:11px ui-monospace,Menlo,monospace;color:#cbd5e3;letter-spacing:.1em}
.fside{position:relative;display:grid;place-items:center;padding:32px;overflow:auto}
.dotz{position:absolute;width:150px;height:150px;background-image:radial-gradient(#2c343d 1.3px,transparent 1.4px);background-size:9px 9px;-webkit-mask-image:radial-gradient(circle,#000,transparent 70%);mask-image:radial-gradient(circle,#000,transparent 70%);pointer-events:none}
.fcard{position:relative;width:100%;max-width:356px}
.fcard h1{font:600 36px/1.1 var(--sans);margin:0 0 8px;letter-spacing:-.6px}
.fcard .sw{color:#9aa4b0;margin:0 0 26px;font-size:14px}
.fcard .sw .lnk{color:#e9edf1}
.auth .inp{background:#171c22;color:#e9edf1;padding:15px 16px}
.auth .inp::placeholder{color:#7c8794}
.pw{position:relative}.pw .eye{position:absolute;right:6px;top:6px;width:36px;height:36px}
.auth .btn{width:100%;background:#a8c4ec;color:#0a0c0f;padding:14px;border-radius:10px;font-size:15px;box-shadow:0 6px 24px rgba(168,196,236,.18)}
.auth .ibtn{color:#9aa4b0}
.or{display:flex;align-items:center;gap:12px;color:#7c8794;font-size:11px;letter-spacing:.12em;margin:22px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:#262d35}
.gbtn{width:100%;display:flex;gap:10px;align-items:center;justify-content:center;padding:13px;border:1px solid #3a434d;border-radius:10px;background:none;color:#e9edf1;font-weight:500}
.gbtn:hover{border-color:#6b7684}
@media(max-width:860px){.auth{grid-template-columns:1fr}.art{display:none}}
/* ---- chat ---- */
.chat{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.mesh{position:absolute;top:0;right:0;width:300px;height:260px;pointer-events:none;display:none}
.chat.empty .mesh{display:block}
.mesh i{position:absolute;width:22px;height:22px;border-radius:3px}
.thread{flex:1;overflow:auto;padding:4px 20px 14px}
.col{max-width:780px;margin:0 auto}
.hero{display:none;align-items:center;justify-content:center;gap:14px;margin:0 0 24px;padding:0 20px;text-align:left}
.hero h1{font:400 clamp(30px,4.2vw,46px)/1.1 var(--serif);margin:0;letter-spacing:-.5px}
.hero .big{width:52px;height:52px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--accent)}
.hero .big svg{width:32px;height:32px}
.chat.empty{justify-content:center;padding-bottom:9vh}
.chat.empty .thread{display:none}
.chat.empty .hero{display:flex}
.dock{flex:none;padding:0 20px 12px}
.dock .in{max-width:780px;margin:0 auto}
.cmp{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:12px 14px 10px;box-shadow:var(--sh)}
.cmp textarea{width:100%;border:0;outline:0;resize:none;background:none;max-height:240px;padding:4px 2px;height:46px;line-height:1.5}
.cmp textarea::placeholder{color:var(--faint)}
.bar{display:flex;gap:8px;align-items:center}
.bar .sp{flex:1}
.rel{position:relative}
.send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on);border:0;display:grid;place-items:center;padding:0}
.send:disabled{opacity:.35;cursor:default}
.mic{width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--mute);display:grid;place-items:center;padding:0}
.mic:hover{background:var(--panel2);color:var(--ink)}
.mic.rec{background:var(--danger);color:var(--on);animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,120,100,.5)}100%{box-shadow:0 0 0 14px rgba(255,120,100,0)}}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);background:none;color:var(--mute);border-radius:999px;padding:7px 14px;font-size:13.5px}
.chip:hover{color:var(--ink);border-color:var(--faint)}
.chip svg{width:15px;height:15px}
.chat:not(.empty) .chips{display:none}
.disc{text-align:center;color:var(--faint);font-size:12px;margin:10px 0 0}
.chat.empty .disc{display:none}
.strip{display:flex;gap:8px;flex-wrap:wrap}.strip:not(:empty){padding:2px 2px 8px}
.pv{position:relative}.pv img{width:60px;height:60px;object-fit:cover;border-radius:10px;display:block}
.pv button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);line-height:1;padding:0}
/* ---- messages ---- */
.row{display:flex;gap:12px;margin:0 0 26px}
.row.user{justify-content:flex-end}
.av{flex:none;width:30px;height:30px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--accent)}
.av svg{width:18px;height:18px}
.bx{min-width:0;flex:1}
.row.user .bx{flex:none;max-width:82%;display:flex;flex-direction:column;align-items:flex-end}
.mb{min-width:0;overflow-wrap:anywhere}
.row.user .mb{background:var(--user);color:#fff;padding:9px 16px;border-radius:20px;white-space:pre-wrap}
.mb p{margin:0 0 .8em;white-space:pre-wrap}.mb>:last-child{margin-bottom:0}
.mb h2,.mb h3,.mb h4,.mb h5{margin:1.3em 0 .45em;line-height:1.3}.mb h2{font-size:1.3em}.mb h3{font-size:1.15em}.mb h4,.mb h5{font-size:1em}
.mb ul,.mb ol{margin:0 0 .8em;padding-left:1.45em}.mb li{margin:.25em 0}
.mb blockquote{margin:0 0 .8em;padding:2px 14px;border-left:3px solid var(--line2);color:var(--mute)}
.mb a{color:var(--accent)}
.mb code{font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--panel2);padding:1px 6px;border-radius:5px}
.cb{margin:0 0 .9em;border-radius:12px;overflow:hidden;background:var(--code);color:var(--codeink);border:1px solid var(--line)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:12px;color:#8fa0ad;border-bottom:1px solid rgba(255,255,255,.07)}
.cp{background:none;border:0;color:#8fa0ad;font-size:12px}.cp:hover{color:#fff}
.cb pre{margin:0;padding:12px 14px;overflow-x:auto}.cb code{background:none;padding:0;color:inherit}
.tc{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:0 0 .9em;overflow:hidden}
.tc .tb{display:flex;justify-content:flex-end;gap:2px;padding:6px 8px 0}
.tc .tw{overflow-x:auto;padding:4px 10px 10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:600}
hr.rule{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.meta{margin-top:8px;font-size:12.5px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.meta button{background:none;border:0;color:var(--mute);display:grid;place-items:center;padding:4px;border-radius:6px}
.meta button:hover{background:var(--panel2);color:var(--ink)}
.meta svg{width:16px;height:16px}
.meta a{color:var(--accent)}
.row.user .meta{opacity:0}.row.user:hover .meta{opacity:1}
.th{display:block;max-width:220px;max-height:160px;border-radius:10px;margin:0 0 8px}
.dots i{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:var(--mute);animation:b 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}.mic.rec{animation:none}}
/* ---- pages ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:34px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:34px}
.plan{border:1px solid var(--line2);border-radius:14px;padding:20px;background:var(--panel);display:flex;flex-direction:column;gap:14px}
.plan.cur{border-color:var(--faint)}
.plan .pr{font-size:32px;font-weight:600;letter-spacing:-.5px}.plan .pr small{font-size:14px;color:var(--mute);font-weight:400;margin-left:4px}
.plan ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:13.5px}
.plan li{display:flex;gap:10px;align-items:flex-start}.plan li svg{width:16px;height:16px;color:var(--mute);margin-top:3px;flex:none}
.plan .btn{background:var(--ink);color:var(--bg)}
.plan .btn.ghost{background:none;color:var(--mute);border:1px solid var(--line2)}
.track{height:5px;border-radius:4px;background:var(--line2);overflow:hidden;margin-top:8px}
.fill{height:100%;background:var(--accent);border-radius:4px}
.kv{display:flex;justify-content:space-between;align-items:baseline;color:var(--mute);font-size:12.5px}
.big-n{font-size:26px;font-weight:600;color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--panel2);border-radius:12px;padding:4px;margin-bottom:20px;max-width:440px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;color:var(--mute);display:flex;gap:7px;align-items:center;justify-content:center}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:var(--sh);font-weight:600}
.tabs svg{width:15px;height:15px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gi .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.gi small{color:var(--mute);overflow-wrap:anywhere}
.gi img,.gi video{width:100%;border-radius:10px;display:block}.gi audio{width:100%}
.list .it{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px}
.it small{display:block;color:var(--mute)}.it .t{overflow-wrap:anywhere}
.drop{display:block;border:2px dashed var(--line2);border-radius:16px;padding:28px;text-align:center;color:var(--mute);margin-bottom:18px;cursor:pointer}
.drop.on,.drop:hover{border-color:var(--accent);color:var(--ink)}
.newkey{margin-bottom:14px;padding:12px 14px;border:1px solid var(--accent);border-radius:12px;background:var(--panel2);overflow-wrap:anywhere}
.fld{display:grid;gap:6px;margin:0 0 18px;max-width:460px;font-size:14px}.fld.inl{display:flex;align-items:center;gap:8px}
.hint{color:var(--mute);font-size:14px;margin:0 0 12px;max-width:640px}
.guide{border:1px solid var(--line2);border-radius:12px;padding:12px 16px;margin:0 0 16px;max-width:680px;background:var(--panel)}
.guide summary{cursor:pointer;font-weight:600}
.guide pre{background:var(--code);color:var(--codeink);padding:10px 12px;border-radius:8px;overflow-x:auto;font:12.5px/1.5 ui-monospace,Menlo,monospace}
.guide ol{padding-left:1.3em;margin:8px 0}.guide li{margin:4px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:60;padding:20px}
.ov.top{place-items:start center;padding-top:12vh}
.mdl{background:var(--panel);border:1px solid var(--line2);padding:18px;border-radius:16px;max-width:560px;width:100%;box-shadow:var(--sh)}
.mdl.wide{max-width:1000px;max-height:86vh;overflow:auto}
.srch{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);margin-bottom:8px}
/* ---- diagrams ---- */
.vz{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:0 0 .9em;overflow:hidden}
.vz .tb{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 0 14px;color:var(--mute);font-size:12px}
.vz .vzb{overflow-x:auto;padding:4px 12px 12px;text-align:center}
.vz .vzb.light{background:#fff}
.vz svg{max-width:100%;height:auto}.vz .svgimg{max-width:100%;height:auto}
.pill.sm2{padding:3px 9px;font-size:12px}
.vz .nd{fill:var(--panel2);stroke:var(--line2);stroke-width:1.4}

    el('div',{class:'pr'},p.price,el('small',{},p.per)),
    p.id===u.plan?el('button',{class:'btn ghost',disabled:true},'Current plan'):el('button',{class:'btn',onclick:()=>waitModal(p.id,p.name)},'Upgrade plan'),
    el('ul',{},p.feat.map(f=>el('li',{},ico('check',16),f)))))); 
  const top=el('div',{class:'card2',style:'display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap'},el('div',{},el('strong',{},'Top up'),el('p',{class:'note',style:'margin:2px 0 0'},'Need more credits today? Buy extra credits any time.')),el('button',{class:'btn ghost',onclick:()=>waitModal('topup','Top-ups')},'Buy credits'));
  $.replaceChildren(shell({title:'',content:[pageHead('Billing','Track your plan, credits and usage.',el('button',{class:'btn ghost sm',onclick:()=>{tab='chat';render()}},'Back to chat')),el('h3',{style:'margin:0 0 12px'},'Subscription overview'),overview,el('h3',{style:'margin:0 0 4px'},'Plans'),el('p',{class:'sub',style:'margin:0 0 14px'},'Pick the plan that fits how you work.'),plans,top]}))}
/* ---------- settings, memory, keys ---------- */
async function settingsView(){
  const [m,v]=await Promise.all([api('/v1/models').catch(()=>({models:[]})),api('/v1/voices').catch(()=>[])]);
  const sel=(k,opts,label)=>{const s=el('select',{class:'sel',style:'width:100%'},opts.map(([a,b])=>el('option',{value:a},b)));s.value=S.getItem(k)||'';s.onchange=()=>S.setItem(k,s.value);return el('label',{class:'fld'},el('span',{},label),s)};
  const auto=el('input',{type:'checkbox'});auto.checked=S.getItem('veya_auto')!=='0';auto.onchange=()=>S.setItem('veya_auto',auto.checked?'1':'0');
  const ver=el('input',{type:'checkbox'}),note=el('p',{class:'note',style:'max-width:520px'});ver.checked=S.getItem('veya_verify')==='1';ver.onchange=()=>S.setItem('veya_verify',ver.checked?'1':'0');
  fetch('/auth/config').then(r=>r.json()).then(c=>{note.textContent=c.run_code?'Code runs on this computer, in a sandbox with no internet and no access to your personal folders. Use only for your own questions.':'Switched off on the server. To allow it, add VEYA_ALLOW_RUN=1 to the .env file and restart.'}).catch(()=>{});
  const aw=el('input',{type:'checkbox'});aw.checked=S.getItem('veya_autoweb')==='1';aw.onchange=()=>S.setItem('veya_autoweb',aw.checked?'1':'0');
  const autoRow=el('label',{class:'fld inl'},aw,el('span',{},'Search the web automatically when a question needs fresh information (off by default)'));
  const cons=el('input',{type:'checkbox'}),cnote=el('p',{class:'note',style:'max-width:520px'});
  api('/v1/privacy/consents').then(d=>{cons.checked=!!(d.consents&&d.consents.model_training)}).catch(()=>{});
  cons.onchange=async()=>{try{await api('/v1/privacy/consents','POST',{scope:'model_training',granted:cons.checked});cnote.textContent=cons.checked?'Thank you. You can switch this off at any time.':'Switched off. Your chats will not be used for training.'}catch(e){cons.checked=!cons.checked;cnote.textContent=e.message}};
  const th=el('select',{class:'sel',style:'width:100%'},el('option',{value:'dark'},'Dark'),el('option',{value:'light'},'Light'));th.value=S.getItem('veya_theme')||'dark';th.onchange=()=>setTheme(th.value);
  $.replaceChildren(shell({title:'',content:[pageHead('Settings','Saved on this device.'),el('label',{class:'fld'},el('span',{},'Theme'),th),sel('veya_model',[['','Default model'],...m.models.map(x=>[x,x])],'Default model'),sel('veya_mode',MODES.map(x=>[x[0],x[1]]),'Default mode'),
    sel('veya_voice',[['','Automatic'],...v.map(x=>[x.name,x.name+' ('+(x.gender?x.gender+', ':'')+x.locale.replace('_','-')+')'])],'Voice for read aloud and voice replies'),el('label',{class:'fld inl'},auto,el('span',{},'Send voice messages automatically')),
    el('label',{class:'fld inl'},ver,el('span',{},'Coding mode: let Veya run its own Python code, see the errors and fix them (up to 3 tries)')),note,cfg.web_search?autoRow:'',
    el('h3',{style:'margin:26px 0 6px'},'Privacy'),el('label',{class:'fld inl'},cons,el('span',{},'Allow Veya to use my learning chats to improve its models (off by default)')),cnote]}))}
async function memoryView(){
  const list=el('div',{class:'list'});
  const load=async()=>{const ms=await api('/v1/memories');list.replaceChildren(...(ms.length?ms.map(m=>el('div',{class:'it'},el('span',{class:'t'},m.text,el('small',{},new Date(m.ts*1000).toLocaleDateString())),
    el('button',{class:'btn warn sm',onclick:async()=>{await api('/v1/memories/'+m.id,'DELETE');load()}},'Forget'))):[el('p',{class:'empt'},'Nothing remembered yet. Tell Veya about yourself in chat. Lasting facts appear here, and you can delete any of them.')]))};
  const all=el('button',{class:'btn warn sm',onclick:async()=>{if(confirm('Forget everything Veya has learned about you?')){await api('/v1/memories','DELETE');load()}}},'Forget everything');
  $.replaceChildren(shell({title:'',content:[pageHead('Memory','What Veya has learned about you. Stored encrypted.',all),list]}));load()}
async function keysView(){
  const list=el('div',{class:'list'}),fresh=el('div');
  const load=async()=>{const ks=await api('/v1/keys');list.replaceChildren(...ks.map(k=>el('div',{class:'it'},el('span',{class:'t'},k.prefix+'...'+(k.current?' (this session)':''),el('small',{},(k.revoked?'Revoked':'Active')+', '+k.uses+' requests')),
    k.revoked?'':el('button',{class:'btn warn sm',onclick:async()=>{if(confirm('Revoke this key? Anything using it stops working.')){await api('/v1/keys/'+k.id,'DELETE');load()}}},'Revoke'))))};
  const add=el('button',{class:'btn sm',onclick:async()=>{const d=await api('/v1/keys','POST');fresh.replaceChildren(el('div',{class:'newkey'},'Copy this key now. It will not be shown again: ',el('strong',{},d.key)));load()}},'Create key');
  const acct=el('div',{class:'newkey',style:'background:none;border-color:var(--line2)'});
  const drawAcct=()=>{if(me.email){acct.replaceChildren(el('strong',{},'Login: '),me.email)}else{
    const e=el('input',{type:'email',placeholder:'Email',class:'inp'}),p=el('input',{type:'password',placeholder:'New password (8+ characters)',class:'inp'}),m=el('div',{class:'err'});
    acct.replaceChildren(el('p',{style:'margin:0 0 10px'},'Add an email and password to this account, so you can log in without an API key. Your memories stay with it.'),e,p,
      el('button',{class:'btn',onclick:async()=>{try{await api('/v1/account/link','POST',{email:e.value,password:p.value});me=await api('/auth/me');drawAcct()}catch(x){m.textContent=x.message}}},'Save login'),m)}};
  drawAcct();
  $.replaceChildren(shell({title:'',content:[pageHead('API keys','Call Veya from your own apps: POST /v1/chat with a Bearer key.',add),acct,fresh,list]}));load()}
async function render(){
  if(!me){try{me=await api('/auth/me')}catch(e){return login()}}
  if(!cfg.max_message){try{cfg=await fetch('/auth/config').then(r=>r.json())}catch(e){}}
  if(!loaded){try{chats=await api('/v1/chats')}catch(e){chats=[]}cur=0;loaded=true;refreshUsage()}
  clearInterval(window._st);clearInterval(slideTimer);Speech.stop();window.__addFiles=null;
  if(tab==='docs'){tab='library';S.setItem('veya_lib','files')}
  ({chat:chatView,library:libraryView,studio:studioView,billing:billingView,memory:memoryView,keys:keysView,settings:settingsView})[tab]().catch(e=>console.error(e));drawChats()}
render();
</script>
